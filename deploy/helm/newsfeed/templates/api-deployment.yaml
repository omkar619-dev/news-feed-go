apiVersion: apps/v1
kind: Deployment # stateless → Deployment (not StatefulSet); no per-pod disk
metadata:
  name: {{ include "newsfeed.fullname" . }}-api
  labels:
    {{- include "newsfeed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      # Wait for Postgres before starting (db.New pings on boot → would crashloop).
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "newsfeed.fullname" . }}-postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command override → uses the Dockerfile ENTRYPOINT (/app/api).
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            # Secrets first (so $(...) interpolation below can reference them).
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: RABBITMQ_PASS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: JWT_SECRET
            # Connection strings: built from the in-cluster Service DNS names +
            # the secret values via $(VAR) (k8s expands these at runtime).
            - name: DATABASE_URL
              value: "postgres://newsfeed:$(DB_PASSWORD)@{{ include "newsfeed.fullname" . }}-postgres:5432/newsfeed?sslmode=disable"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@{{ include "newsfeed.fullname" . }}-rabbitmq:5672/"
            - name: REDIS_ADDR
              value: "{{ include "newsfeed.fullname" . }}-redis:6379"
            - name: OLLAMA_URL
              value: "{{ .Values.ollamaURL }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "newsfeed.fullname" . }}-api
  labels:
    {{- include "newsfeed.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
