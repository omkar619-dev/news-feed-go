apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "newsfeed.fullname" . }}-relay
  labels:
    {{- include "newsfeed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.relay.replicaCount }}
  selector:
    matchLabels:
      {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "relay") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "relay") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "newsfeed.fullname" . }}-postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SAME image as the API/worker — THIRD role: the transactional-outbox
          # relay (reads the outbox table, publishes to RabbitMQ).
          command: ["/app/relay"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: RABBITMQ_PASS
            - name: DATABASE_URL
              value: "postgres://newsfeed:$(DB_PASSWORD)@{{ include "newsfeed.fullname" . }}-postgres:5432/newsfeed?sslmode=disable"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@{{ include "newsfeed.fullname" . }}-rabbitmq:5672/"
            # No OLLAMA_URL (the relay doesn't embed) and no Redis/JWT (it doesn't serve requests).
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
