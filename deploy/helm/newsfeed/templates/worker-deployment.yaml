apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "newsfeed.fullname" . }}-worker
  labels:
    {{- include "newsfeed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "newsfeed.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "newsfeed.fullname" . }}-postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SAME image as the API — but run the OTHER binary. This one line is
          # the whole "two roles, one image" idea.
          command: ["/app/worker"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "newsfeed.fullname" . }}-secrets
                  key: RABBITMQ_PASS
            - name: DATABASE_URL
              value: "postgres://newsfeed:$(DB_PASSWORD)@{{ include "newsfeed.fullname" . }}-postgres:5432/newsfeed?sslmode=disable"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@{{ include "newsfeed.fullname" . }}-rabbitmq:5672/"
            # The worker embeds posts → it needs Ollama too. (No Redis/JWT — it
            # doesn't serve requests or read the cache.)
            - name: OLLAMA_URL
              value: "{{ .Values.ollamaURL }}"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
